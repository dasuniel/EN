<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inglés en Casa · El curso de mamá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBFC; --card:#FFFFFF; --ink:#1C2733; --soft:#5B6B7B;
  --pen:#1A56C4; --pen-dark:#12409A; --redpen:#D33A2C;
  --rule:#D6E4F0; --line:#E3EAF1; --star:#F5B301; --ok:#1E8E5A;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{font-size:17px;}
body{
  font-family:"Atkinson Hyperlegible", system-ui, sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55;
  padding-bottom:84px;
}
h1,h2,h3{font-family:"Bricolage Grotesque", system-ui, sans-serif; line-height:1.2;}
button{font-family:inherit; font-size:1rem; cursor:pointer;}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:3px solid var(--pen); outline-offset:2px; border-radius:6px;
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

.wrap{max-width:680px; margin:0 auto; padding:0 16px;}
header.top{padding:22px 0 8px;}
header.top h1{font-size:1.7rem; font-weight:800; letter-spacing:-.02em;}
header.top h1 .dot{color:var(--pen);}
header.top p{color:var(--soft); font-size:.95rem;}

.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:18px; margin:14px 0;
}
.card h2{font-size:1.2rem; margin-bottom:8px;}
.card h3{font-size:1.05rem; margin:14px 0 6px;}

/* ——— Hoja de cuaderno (firma visual) ——— */
.cuaderno{
  background-color:#FFFFFF;
  background-image:
    linear-gradient(to right, transparent 44px, #F0B7B1 44px, #F0B7B1 46px, transparent 46px),
    repeating-linear-gradient(to bottom, transparent, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  border:1px solid var(--line); border-radius:14px;
  padding:20px 18px 20px 62px; margin:14px 0;
}
.cuaderno .eyebrow{
  font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--redpen); margin-bottom:2px;
}
.cuaderno h2{font-size:1.35rem;}
.cuaderno .meta{color:var(--soft); font-size:.92rem; margin-bottom:10px;}

.btn{
  display:inline-block; background:var(--pen); color:#fff; border:none;
  border-radius:12px; padding:13px 18px; font-weight:700; min-height:48px;
  transition:background .15s;
}
.btn:hover{background:var(--pen-dark);}
.btn.ghost{background:#fff; color:var(--pen); border:2px solid var(--pen);}
.btn.small{padding:8px 12px; min-height:40px; font-size:.92rem; border-radius:10px;}
.btn.done{background:var(--ok);}
.btn.red{background:var(--redpen);}
.btn:disabled{opacity:.5; cursor:default;}
.btnrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}

.speak{
  background:#EAF1FB; border:1px solid #CFE0F5; color:var(--pen);
  border-radius:10px; padding:6px 10px; font-size:.95rem; min-height:38px;
}
.speak:hover{background:#DDE9F9;}

table.tbl{width:100%; border-collapse:collapse; font-size:.97rem;}
table.tbl th{
  text-align:left; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em;
  color:var(--soft); padding:8px 8px; border-bottom:2px solid var(--line);
}
table.tbl td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
table.tbl td.en{font-weight:700;}
table.tbl td.pr{color:var(--soft); font-style:italic;}

.badge{
  display:inline-block; font-size:.78rem; font-weight:700; padding:3px 9px;
  border-radius:99px; background:#EAF1FB; color:var(--pen);
}
.badge.rev{background:#FCEBE9; color:var(--redpen);}
.badge.lock{background:#EEF1F4; color:var(--soft);}
.badge.now{background:var(--pen); color:#fff;}

.tabbar{
  position:fixed; bottom:0; left:0; right:0; background:#fff;
  border-top:1px solid var(--line); display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:50;
}
.tabbar button{
  background:none; border:none; color:var(--soft); font-size:.78rem; font-weight:700;
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px;
  border-radius:10px; min-width:60px;
}
.tabbar button .ico{font-size:1.35rem;}
.tabbar button.active{color:var(--pen); background:#EAF1FB;}

.dialogo{margin:8px 0;}
.dialogo .ln{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line);}
.dialogo .who{font-weight:700; color:var(--pen); min-width:64px;}

.fill-item{margin:10px 0;}
.fill-item input{
  font-family:inherit; font-size:1rem; padding:9px 10px; border:2px solid var(--line);
  border-radius:10px; width:130px;
}
.fill-item.good input{border-color:var(--ok); background:#EDF8F2;}
.fill-item.bad input{border-color:var(--redpen); background:#FCF0EF;}
.fill-item .sol{font-weight:700; color:var(--ok); margin-left:8px;}

.match-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.match-grid button{
  border:2px solid var(--line); background:#fff; border-radius:10px; padding:11px 8px;
  font-size:.95rem; min-height:48px;
}
.match-grid button.sel{border-color:var(--pen); background:#EAF1FB;}
.match-grid button.hit{border-color:var(--ok); background:#EDF8F2; color:var(--ok); font-weight:700;}

.flash{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:30px 18px;
  text-align:center; margin:14px 0;
}
.flash .es{font-size:1.5rem; font-family:"Bricolage Grotesque"; font-weight:800;}
.flash .en{font-size:1.3rem; color:var(--pen); font-weight:700; margin-top:8px;}
.flash .pr{color:var(--soft); font-style:italic;}

.stars{font-size:1.3rem; letter-spacing:.1em;}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;}
.statgrid .num{font-family:"Bricolage Grotesque"; font-weight:800; font-size:1.7rem; color:var(--pen);}
.statgrid .lbl{font-size:.82rem; color:var(--soft);}

.grade-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0;}
.grade-row input[type=number]{
  width:70px; padding:8px; border:2px solid var(--line); border-radius:10px; font-size:1rem;
}
.grade-row label{font-size:.88rem; color:var(--soft);}
textarea.notas{
  width:100%; min-height:70px; border:2px solid var(--line); border-radius:10px;
  padding:10px; font-family:inherit; font-size:.95rem; margin-top:6px;
}
.bars{display:flex; gap:6px; align-items:flex-end; height:110px; margin-top:12px;}
.bars .b{flex:1; background:#EAF1FB; border-radius:6px 6px 0 0; position:relative; min-width:10px;}
.bars .b i{position:absolute; bottom:0; left:0; right:0; background:var(--pen); border-radius:6px 6px 0 0;}
.bars .b span{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:.7rem; color:var(--soft);}

.teacher-line{border-top:3px solid var(--redpen); margin-top:18px; padding-top:12px;}
.teacher-line h2{color:var(--redpen);}

.plan-item{display:flex; gap:10px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line);}
.plan-item .wn{font-family:"Bricolage Grotesque"; font-weight:800; color:var(--soft); min-width:34px;}
.plan-item .tt{flex:1;}
.plan-item .tt small{display:block; color:var(--soft);}

.hint{font-size:.9rem; color:var(--soft);}
.divider{border:none; border-top:1px solid var(--line); margin:16px 0;}
ul.simple{padding-left:20px;}
ul.simple li{margin:6px 0;}

#printArea{display:none;}
@media print{
  body > *{display:none !important;}
  body{padding:0; background:#fff;}
  #printArea{display:block !important; font-size:12pt; color:#000;}
  #printArea h1{font-size:18pt; margin-bottom:4pt;}
  #printArea h2{font-size:14pt; margin:14pt 0 6pt; border-bottom:1pt solid #999; padding-bottom:2pt;}
  #printArea table{width:100%; border-collapse:collapse; font-size:11pt;}
  #printArea td, #printArea th{border:1pt solid #999; padding:4pt 6pt; text-align:left;}
  #printArea .pbreak{page-break-before:always;}
  #printArea .writeline{border-bottom:1pt solid #555; height:22pt;}
  #printArea p{margin:5pt 0;}
}
</style>
</head>
<body>
<header class="top wrap">
  <h1>Inglés en Casa<span class="dot">.</span></h1>
  <p>Tu reto: 15–30 minutos al día, paso a paso.</p>
</header>
<main class="wrap" id="view"></main>
<nav class="tabbar" aria-label="Secciones">
  <button data-tab="hoy" class="active"><span class="ico">📖</span>Hoy</button>
  <button data-tab="semana"><span class="ico">📚</span>Semana</button>
  <button data-tab="repaso"><span class="ico">🔁</span>Repaso</button>
  <button data-tab="plan"><span class="ico">🗺️</span>Plan</button>
  <button data-tab="progreso"><span class="ico">⭐</span>Progreso</button>
</nav>
<div id="printArea"></div>
<script>
"use strict";
// ============ CONTENIDO · BLOQUE 1 (Semanas 1–12) ============
const WEEKS = [
{ n:1, theme:"Saludos y presentaciones", goal:"Saludar, despedirte y decir tu nombre",
  vocab:[["Hello","jelóu","Hola"],["Hi","jái","Hola (informal)"],["Good morning","gud mórning","Buenos días"],["Good afternoon","gud afternún","Buenas tardes"],["Good night","gud náit","Buenas noches (al despedirse)"],["Goodbye / Bye","gudbái / bái","Adiós"],["Please","plis","Por favor"],["Thank you","zénk iu","Gracias"],["Yes / No","iés / nóu","Sí / No"],["My name is…","mái néim is","Me llamo…"],["What's your name?","uáts iór néim","¿Cómo te llamas?"],["Nice to meet you","náis tu mít iu","Mucho gusto"]],
  grammar:{ title:"I am / You are",
    lines:["En inglés, \"yo soy / yo estoy\" se dice I am, y \"tú eres / tú estás\" se dice You are. Es un solo verbo (be) que sirve para \"ser\" y para \"estar\".","Para preguntar, el verbo va primero: Are you Daniel? → ¿Tú eres Daniel?","Palabras de apoyo: from = de (origen) · happy = feliz · son = hijo."],
    ex:[["I am Ana.","Yo soy Ana."],["I am from Colombia.","Yo soy de Colombia."],["You are my son.","Tú eres mi hijo."],["Are you Daniel?","¿Tú eres Daniel?"]] },
  dialogue:[["Ana","Hello! Good morning."],["Carlos","Hi! Good morning."],["Ana","My name is Ana. What's your name?"],["Carlos","My name is Carlos."],["Ana","Nice to meet you, Carlos."],["Carlos","Nice to meet you too."],["Ana","Goodbye!"],["Carlos","Bye!"]],
  fill:[["I ______ Ana.","am"],["You ______ Carlos.","are"],["I ______ from Colombia.","am"],["You ______ my son.","are"],["I ______ happy.","am"],["______ you Daniel?","are"]],
  match:[["Good morning","Buenos días"],["Thank you","Gracias"],["Nice to meet you","Mucho gusto"],["Goodbye","Adiós"],["What's your name?","¿Cómo te llamas?"],["Please","Por favor"]],
  paper:["Copia cada palabra del vocabulario 2 veces en tu cuaderno y léela en voz alta 3 veces (usa el botón 🔊 de la app para escucharla primero). Marca con una estrella las 3 más difíciles.","Escucha el diálogo en la app (primero sin leer, luego leyendo) y responde en tu cuaderno: 1) ¿Cómo se llama la señora? 2) ¿Qué responde Carlos a \"Nice to meet you\"? 3) ¿Cuántas expresiones del vocabulario encuentras en el diálogo?","Copia y completa en tu cuaderno las 6 frases de la práctica con am o are (sección Práctica de la app, pero escríbelas a mano).","Escribe tu primera presentación: Hello! / My name is ___ . / I am from ___ . / Nice to meet you! Léela en voz alta 5 veces.","Haz el ejercicio de unir columnas en papel, y graba una nota de voz diciendo tu presentación (sin leerla si puedes). Envíasela a tu profesor: es tu punto de partida, ¡guárdenla!"],
  quiz:{ a:[["Buenos días","Good morning"],["Gracias","Thank you"],["Adiós","Goodbye"],["Mucho gusto","Nice to meet you"]],
    b:{ lines:["A: ______ ! My name is Rosa. What's your ______ ?","B: My name is Pedro. ______ to meet you!"], bank:["Hello","name","Nice"], ans:["Hello","name","Nice"] },
    c:[["I ______ Rosa.","am"],["You ______ my friend. (friend = amigo/a)","are"],["______ you Pedro?","Are"]] } },

{ n:2, theme:"Información personal", goal:"Decir tu edad, de dónde eres y tu teléfono",
  vocab:[["friend","frend","amigo / amiga"],["teacher","tícher","profesor(a)"],["student","stiúdent","estudiante"],["woman","úman","mujer"],["man","man","hombre"],["city","síti","ciudad"],["country","cántri","país"],["phone number","fóun námber","número de teléfono"],["How old are you?","jáu óuld ar iú","¿Cuántos años tienes?"],["I am … years old","ái am … íers óuld","Tengo … años"],["Where are you from?","uér ar iú from","¿De dónde eres?"],["He is / She is","jí is / shí is","Él es / Ella es"]],
  grammar:{ title:"He is / She is + los números",
    lines:["Para él y ella se usa is: He is my friend (Él es mi amigo). She is from Cali (Ella es de Cali).","Pregunta: Is she your teacher? → ¿Ella es tu profesora?","Números: 1 one (uán) · 2 two (tu) · 3 three (zri) · 4 four (for) · 5 five (fáiv) · 6 six (siks) · 7 seven (séven) · 8 eight (éit) · 9 nine (náin) · 10 ten (ten) · 11 eleven · 12 twelve · 13 thirteen · 15 fifteen · 20 twenty (tuénti) · 30 thirty · 40 forty · 50 fifty · 60 sixty · 70 seventy · 80 eighty · 90 ninety · 100 one hundred (uán jándred)."],
    ex:[["She is my friend.","Ella es mi amiga."],["He is 70 years old.","Él tiene 70 años."],["I am from Bogotá.","Yo soy de Bogotá."],["Is she a teacher?","¿Ella es profesora?"]] },
  dialogue:[["Rosa","Good afternoon!"],["Pedro","Good afternoon!"],["Rosa","Where are you from?"],["Pedro","I am from Bogotá. And you?"],["Rosa","I am from Cali. How old are you?"],["Pedro","I am 62 years old."],["Rosa","Marta is my friend. She is from Medellín."],["Pedro","Nice to meet you, Marta!"]],
  fill:[["She ______ my friend.","is"],["I ______ from Cali.","am"],["He ______ 70 years old.","is"],["______ you from Bogotá?","are"],["My teacher ______ from Colombia.","is"],["You ______ a student.","are"]],
  match:[["friend","amigo/a"],["teacher","profesor(a)"],["city","ciudad"],["woman","mujer"],["country","país"],["student","estudiante"]],
  paper:["Copia el vocabulario 2 veces y escríbelo en voz alta con la app. Además, escribe los números del 1 al 20 en inglés.","Escucha el diálogo y responde en tu cuaderno: 1) ¿De dónde es Pedro? 2) ¿Cuántos años tiene? 3) ¿De dónde es Marta?","Copia y completa a mano las 6 frases de la práctica con am, is o are.","Escribe 4 frases sobre un amigo o amiga: su nombre, de dónde es, cuántos años tiene y algo más. (Ejemplo: She is my friend. Her… ¡usa lo que sabes!)","Haz el ejercicio de unir columnas en papel y graba un audio diciendo tu edad, tu ciudad y tu número de teléfono en inglés."],
  quiz:{ a:[["amigo","friend"],["profesor","teacher"],["ciudad","city"],["¿De dónde eres?","Where are you from?"]],
    b:{ lines:["A: How old ______ you?","B: I ______ 65 years old.","A: She ______ my friend."], bank:["am","is","are"], ans:["are","am","is"] },
    c:[["Escribe el número 15 en inglés:","fifteen"],["Escribe el número 40 en inglés:","forty"],["Escribe el número 100 en inglés:","one hundred"]] } },

{ n:3, theme:"La familia", goal:"Presentar a tu familia",
  vocab:[["mother (mom)","máder (mom)","mamá"],["father (dad)","fáder (dad)","papá"],["son","san","hijo"],["daughter","dóter","hija"],["brother","bráder","hermano"],["sister","síster","hermana"],["husband","jásband","esposo"],["wife","uáif","esposa"],["grandmother","gránmader","abuela"],["grandfather","gránfader","abuelo"],["parents","pérents","papás"],["family","fámili","familia"]],
  grammar:{ title:"my, your, his, her + This is…",
    lines:["Los posesivos: my = mi · your = tu · his = de él · her = de ella.","Para presentar a alguien: This is my son (Este es mi hijo). His name is Daniel (Él se llama Daniel).","Ojo: his va con hombre, her va con mujer, sin importar de quién sea la cosa."],
    ex:[["This is my son.","Este es mi hijo."],["His name is Daniel.","Él se llama Daniel."],["This is my sister. Her name is Luz.","Esta es mi hermana. Ella se llama Luz."],["Is she your daughter?","¿Ella es tu hija?"]] },
  dialogue:[["Gloria","Look! This is my family."],["Elena","Oh! Who is he?"],["Gloria","He is my husband. His name is Jorge."],["Elena","And who is she?"],["Gloria","She is my daughter. Her name is Paula."],["Elena","Is he your son?"],["Gloria","Yes! His name is Daniel. He is a student."],["Elena","What a nice family!"]],
  fill:[["This is ______ son. (mi)","my"],["______ name is Daniel. (de él)","his"],["This is my sister. ______ name is Luz.","her"],["Is she ______ daughter? (tu)","your"],["______ husband is from Cali. (mi)","my"],["This is Ana. ______ family is big.","her"]],
  match:[["mother","mamá"],["husband","esposo"],["daughter","hija"],["brother","hermano"],["grandmother","abuela"],["son","hijo"]],
  paper:["Copia el vocabulario 2 veces, escuchándolo en la app. Marca las 3 palabras más difíciles.","Escucha el diálogo y responde: 1) ¿Cómo se llama el esposo de Gloria? 2) ¿Quién es Paula? 3) ¿Qué hace Daniel?","Copia y completa a mano las 6 frases con my, your, his o her.","Dibuja tu árbol genealógico (mínimo 6 personas) y escribe debajo de cada uno qué es en inglés: mother, son, sister…","Escribe 4 frases presentando a tu familia (This is my… His/Her name is…) y graba un audio presentando a 2 familiares."],
  quiz:{ a:[["hermana","sister"],["esposo","husband"],["abuela","grandmother"],["hija","daughter"]],
    b:{ lines:["This is ______ family. (mi)","This is my son. ______ name is Daniel.","This is my mother. ______ name is Rosa."], bank:["Her","my","His"], ans:["my","His","Her"] },
    c:[["Escribe una frase presentando a tu mamá o a tu papá:","This is my mother / This is my father"],["Escribe una frase presentando a un hijo o hija:","This is my son / This is my daughter"],["Traduce: Él se llama Pedro.","His name is Pedro"]] } },

{ n:4, theme:"Repaso 1 + Evaluación", goal:"Sostener una mini conversación de 1 minuto", review:true,
  vocab:[], dialogue:[],
  grammar:{ title:"Qué repasamos esta semana",
    lines:["Esta semana no hay tema nuevo: se consolida todo lo de las semanas 1 a 3.","Verbo be: I am, You are, He/She is (y las preguntas: Are you…? Is she…?).","Posesivos: my, your, his, her.","Vocabulario: saludos, información personal, números y familia. Usa la pestaña Repaso de la app todos los días."],
    ex:[["What's your name?","¿Cómo te llamas?"],["How old are you?","¿Cuántos años tienes?"],["Where are you from?","¿De dónde eres?"],["Who is he?","¿Quién es él?"]] },
  fill:[["I ______ Gloria.","am"],["______ you from Bogotá?","are"],["She ______ my daughter.","is"],["This is my son. ______ name is Daniel.","his"],["______ name is Ana. (de ella)","her"],["You ______ my teacher.","are"]],
  match:[["Good morning","Buenos días"],["How old are you?","¿Cuántos años tienes?"],["sister","hermana"],["country","país"],["Nice to meet you","Mucho gusto"],["husband","esposo"]],
  paper:["Repasa en la pestaña Repaso de la app (10 min) y copia una vez las palabras que marques como difíciles.","Escribe tu presentación ampliada (6 frases): saludo, nombre, edad, ciudad, y presenta a 2 familiares.","Responde por escrito estas preguntas con frase completa: What's your name? · How old are you? · Where are you from? · Who is your favorite person? (favorite = favorita)","Ensaya en voz alta tu presentación 3 veces, y luego grábala. Compárenla con el audio de la semana 1: ¡escucha tu progreso!","Prepara la evaluación: tu profesor te hará una conversación de 1 minuto con las preguntas del día 3. Repasa con la app y descansa."],
  evalGuide:["Conversación de 1 minuto: el profesor saluda, pregunta nombre, edad, origen, y pide presentar a un familiar.","Comparar el audio de esta semana con el de la semana 1 (¡celebrar la diferencia!).","Aplicar el Quiz 4 impreso y calificarlo en la clase."],
  quiz:{ a:[["Buenas tardes","Good afternoon"],["estudiante","student"],["abuelo","grandfather"],["Tengo 60 años","I am 60 years old"]],
    b:{ lines:["A: What's your ______ ?","B: My name is Rosa. I ______ from Cali.","A: ______ is my brother. His name is Luis."], bank:["This","name","am"], ans:["name","am","This"] },
    c:[["Responde con frase completa: How old are you?","I am … years old"],["Responde: Where are you from?","I am from …"],["Presenta a alguien de tu familia:","This is my …"]] } },

{ n:5, theme:"La casa y las cosas", goal:"Describir tu casa y decir dónde están las cosas",
  vocab:[["house","jáus","casa"],["kitchen","kíchen","cocina"],["bedroom","bédrum","habitación"],["bathroom","bázrum","baño"],["living room","líving rum","sala"],["table","téibol","mesa"],["chair","cher","silla"],["bed","bed","cama"],["door","dor","puerta"],["window","uíndou","ventana"],["lamp","lamp","lámpara"],["television (TV)","telivíshon","televisor"]],
  grammar:{ title:"There is / There are",
    lines:["There is = hay (una cosa). There are = hay (varias cosas).","There is a table in the kitchen → Hay una mesa en la cocina. There are two bedrooms → Hay dos habitaciones.","Para ubicar: in = en/dentro · on = sobre · under = debajo. The TV is on the table → El televisor está sobre la mesa."],

function speak(text, slow){

function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?'']/g,"").replace(/\s+/g," ").trim(); }
function okAnswer(input, ans){ const i = norm(input); return ans.split("/").some(a => norm(a) === i); }
function seededShuffle(arr, seed){
  const a = arr.slice(); let s = seed * 9301 + 49297;
  for (let i = a.length-1; i > 0; i--){ s = (s * 9301 + 49297) % 233280; const j = Math.floor((s/233280) * (i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

function buildMatch(w){
  const box = document.getElementById("matchBox");
  const left = w.match.map((p,i) => ({t:p[0], k:i}));
  const right = seededShuffle(w.match.map((p,i) => ({t:p[1], k:i})), w.n * 7 + 3);
  let sel = null;
  box.innerHTML = "";
  const rows = Math.max(left.length, right.length);
  for (let i = 0; i < rows; i++){
    [left[i], right[i]].forEach((item, side) => {
      const b = document.createElement("button");
      b.textContent = item.t;
      b.onclick = () => {
        if (b.classList.contains("hit")) return;
        if (sel && sel.side === side){ sel.btn.classList.remove("sel"); sel = {side, k:item.k, btn:b}; b.classList.add("sel"); return; }
        if (!sel){ sel = {side, k:item.k, btn:b}; b.classList.add("sel"); return; }
        if (sel.k === item.k){ b.classList.add("hit"); sel.btn.classList.remove("sel"); sel.btn.classList.add("hit"); speak(w.match[item.k][0], false); sel = null; }
        else { sel.btn.classList.remove("sel"); sel = null; }
      };
      box.appendChild(b);
    });
  }
}

function weeklyGrade(g){
  const ts = ["t1","t2","t3","t4","t5"].map(k => g[k]).filter(x => typeof x === "number" && !isNaN(x));
  const hasT = ts.length > 0, hasQ = typeof g.quiz === "number" && !isNaN(g.quiz);
  if (!hasT && !hasQ) return null;
  const tAvg = hasT ? ts.reduce((a,b) => a + b, 0) / ts.length : null;
  const qOn5 = hasQ ? g.quiz / 2 : null;
  if (hasT && hasQ) return Math.round((tAvg * 0.5 + qOn5 * 0.5) * 10) / 10;
  return Math.round((hasT ? tAvg : qOn5) * 10) / 10;
}

      <div class="btnrow"><button class="btn red small" id="teaOn">Activar modo profesor</button></div></div>`;
  } else {
    const gwk = GRADEWEEK || S.week;
    const g = S.grades[gwk] || {};
    h += `<div class="card" style="border-color:#F0C8C3">
      <h3 style="margin-top:0">Calificar semana <select id="teaWeek">${WEEKS.map(w => `<option value="${w.n}" ${w.n === gwk ? "selected" : ""}>Semana ${w.n}</option>`).join("")}</select></h3>
      <p class="hint">Tareas del cuaderno, de 0 a 5,0 cada una (deja vacías las no entregadas):</p>
      <div class="grade-row">${[1,2,3,4,5].map(i => `<label>T${i} <input type="number" id="t${i}" min="0" max="5" step="0.1" value="${g["t" + i] ?? ""}"></label>`).join("")}</div>
      <div class="grade-row"><label>Quiz (/10) <input type="number" id="tq" min="0" max="10" step="0.5" value="${g.quiz ?? ""}"></label></div>
      <label class="hint">Errores recurrentes / notas para la próxima clase:</label>
      <textarea class="notas" id="tn">${esc(g.notes || "")}</textarea>
      <div class="btnrow"><button class="btn red" id="teaSave">Guardar nota</button><button class="btn small ghost" id="teaOff">Salir del modo profesor</button></div></div>
    <div class="card"><h3 style="margin-top:0">Respaldo de datos</h3>
      <p class="hint">El progreso vive en este navegador. Exporta un respaldo de vez en cuando (sirve también para pasar de celular).</p>
      <div class="btnrow">
        <button class="btn small ghost" id="expBtn">⬇️ Exportar respaldo</button>
        <label class="btn small ghost" style="display:inline-flex;align-items:center">⬆️ Importar<input type="file" id="impBtn" accept=".json" style="display:none"></label>
        <button class="btn small red" id="rstBtn">Borrar todo</button>
      </div></div></div>`;
  }
  view.innerHTML = h;
  const on = document.getElementById("teaOn"); if (on) on.onclick = () => { S.teacher = true; save(); render(); };
  const off = document.getElementById("teaOff"); if (off) off.onclick = () => { S.teacher = false; GRADEWEEK = null; save(); render(); };
  const tw = document.getElementById("teaWeek");
  if (tw) tw.onchange = () => { GRADEWEEK = parseInt(tw.value); render(); };
  const ts = document.getElementById("teaSave");
  if (ts) ts.onclick = () => {
    const wk = parseInt(document.getElementById("teaWeek").value);
    const g = {};
    [1,2,3,4,5].forEach(i => { const v = parseFloat(document.getElementById("t" + i).value); if (!isNaN(v)) g["t" + i] = Math.min(5, Math.max(0, v)); });
    const q = parseFloat(document.getElementById("tq").value); if (!isNaN(q)) g.quiz = Math.min(10, Math.max(0, q));
    g.notes = document.getElementById("tn").value;
    S.grades[wk] = g; save(); render();
  };
  const ex = document.getElementById("expBtn");
  if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "ingles-en-casa-respaldo.json"; a.click(); URL.revokeObjectURL(a.href);
  };
  const im = document.getElementById("impBtn");
  if (im) im.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try{ S = Object.assign({}, DEF, JSON.parse(r.result)); save(); render(); alert("Respaldo importado ✓"); }catch(err){ alert("Ese archivo no es un respaldo válido."); } };
    r.readAsText(f);
  };
  const rs = document.getElementById("rstBtn");
  if (rs) rs.onclick = () => { if (confirm("¿Borrar TODO el progreso y las notas? Esta acción no se puede deshacer.")){ S = Object.assign({}, DEF); save(); render(); } };
}

// ============ IMPRESIÓN ============
function matchPrintData(w){
  const order = seededShuffle(w.match.map((p,i) => i), w.n * 7 + 3);
  const right = order.map((k,pos) => ({letter:LETTERS[pos], es:w.match[k][1], k}));
  const answers = w.match.map((p,i) => { const pos = order.indexOf(i); return LETTERS[pos]; });
  return {right, answers};
}
function printSheet(w, teacher){
  const A = document.getElementById("printArea");
  const mp = matchPrintData(w);
  let h = "";
  if (!teacher){
    h += `<h1>Inglés en Casa · Semana ${w.n}: ${esc(w.theme)}</h1>
      <p><b>Meta:</b> ${esc(w.goal)}. · 15–30 minutos al día. ¡No te saltes días! ⭐</p>`;
    if (w.vocab.length){
      h += `<h2>Vocabulario</h2><table><tr><th>Inglés</th><th>Suena como</th><th>Español</th></tr>`;
      w.vocab.forEach(v => h += `<tr><td><b>${esc(v[0])}</b></td><td><i>${esc(v[1])}</i></td><td>${esc(v[2])}</td></tr>`);
      h += `</table>`;
    }
    if (w.dialogue.length){
      h += `<h2>Diálogo (escúchalo en la app)</h2>`;
      w.dialogue.forEach(l => h += `<p><b>${esc(l[0])}:</b> ${esc(l[1])}</p>`);
    }
    h += `<h2>${w.review ? "Repaso" : "Gramática"}: ${esc(w.grammar.title)}</h2>`;
    w.grammar.lines.forEach(l => h += `<p>${esc(l)}</p>`);
    w.grammar.ex.forEach(e => h += `<p>• <b>${esc(e[0])}</b> — ${esc(e[1])}</p>`);
    h += `<h2>Ejercicio 1 · Completa la frase</h2>`;
    w.fill.forEach((f,i) => h += `<p>${i + 1}. ${esc(f[0]).replace("______", "____________")}</p>`);
    h += `<h2>Ejercicio 2 · Une las parejas (escribe la letra)</h2><table><tr><th>Inglés</th><th></th><th>Español</th></tr>`;
    w.match.forEach((p,i) => h += `<tr><td>${i + 1}. ${esc(p[0])}  (    )</td><td></td><td>${mp.right[i] ? mp.right[i].letter + ". " + esc(mp.right[i].es) : ""}</td></tr>`);
    h += `</table><h2>Tareas en el cuaderno</h2>`;
    w.paper.forEach((t,i) => h += `<p><b>${i <= 4 ? DAYNAMES[i] : "Extra"}:</b> ${esc(t)}</p>`);
    h += `<p style="margin-top:14pt"><i>Hecho con cariño por tu profesor 💙</i></p>`;
  } else {
    h += `<h1>Hoja del profesor · Semana ${w.n}: ${esc(w.theme)}</h1>
      <p><b>Rúbrica por tarea (/5,0):</b> el mensaje se entiende (2,0) + vocabulario de la semana (1,5) + gramática del tema (1,5). Máximo 3 correcciones detalladas por tarea; lo demás, a la lista de errores recurrentes. Quiz /10. Nota semanal = tareas 50 % + quiz 50 %.</p>
      <h2>Quiz · Semana ${w.n} — Nombre: __________________ Nota: ____ /10</h2>
      <p><b>Parte A (4 puntos) — Escribe en inglés:</b></p>`;
    w.quiz.a.forEach((q,i) => h += `<p>${i + 1}. ${esc(q[0])}: ____________________</p>`);
    h += `<p><b>Parte B (3 puntos) — Completa con:</b> ${w.quiz.b.bank.map(esc).join(" · ")}</p>`;
    w.quiz.b.lines.forEach(l => h += `<p>${esc(l)}</p>`);
    h += `<p><b>Parte C (3 puntos):</b></p>`;
    w.quiz.c.forEach((q,i) => h += `<p>${i + 1}. ${esc(q[0])} ____________________</p>`);
    if (w.evalGuide){
      h += `<h2>Evaluación oral</h2>`;
      w.evalGuide.forEach(g => h += `<p>• ${esc(g)}</p>`);
    }
    h += `<div class="pbreak"></div><h1>Respuestas · Semana ${w.n}</h1>
      <h2>Ejercicio 1 (hoja de la semana)</h2><p>${w.fill.map((f,i) => (i + 1) + ". " + esc(f[1].split("/")[0])).join(" · ")}</p>
      <h2>Ejercicio 2 (unir parejas)</h2><p>${mp.answers.map((a,i) => (i + 1) + "-" + a).join(" · ")}</p>
      <h2>Quiz</h2>
      <p><b>A:</b> ${w.quiz.a.map((q,i) => (i + 1) + ". " + esc(q[1])).join(" · ")}</p>
      <p><b>B:</b> ${w.quiz.b.ans.map(esc).join(" · ")}</p>
      <p><b>C:</b> ${w.quiz.c.map((q,i) => (i + 1) + ". " + esc(q[1])).join(" · ")}</p>
      <h2>Errores recurrentes de la semana</h2>
      <div class="writeline"></div><div class="writeline"></div><div class="writeline"></div><div class="writeline"></div>`;
  }
  A.innerHTML = h;
  window.print();
}

// ============ ARRANQUE ============
render();
</script>
